<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECONVEXA — Jornal Cultural Digital do Recôncavo Baiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Barlow+Condensed:wght@300;400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;1,8..60,300;1,8..60,400&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --vermelho: #C8102E;
  --amarelo: #FFCF01;
  --azul: #003DA5;
  --azul-escuro: #1B2A4A;
  --roxo: #7B2FBE;
  --laranja: #E8601A;
  --branco: #FDFCFF;
  --cinza-claro: #F5F3EE;
  --cinza-texto: #444;
  --borda: #e0ddd5;

  --fonte-titulo: 'Playfair Display', Georgia, serif;
  --fonte-logo: 'Barlow Condensed', sans-serif;
  --fonte-corpo: 'Source Serif 4', Georgia, serif;
  --fonte-meta: 'Barlow', sans-serif;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--cinza-claro);
  color: var(--cinza-texto);
  font-family: var(--fonte-corpo);
  line-height: 1.6;
  font-size: 16px;
}

/* ─── TOPO BANDEIRA ─── */
.faixa-bandeira {
  display: flex;
  height: 5px;
  width: 100%;
}
.faixa-bandeira span:nth-child(1) { background: var(--vermelho); flex: 1; }
.faixa-bandeira span:nth-child(2) { background: var(--amarelo); flex: 1; }
.faixa-bandeira span:nth-child(3) { background: var(--azul); flex: 1; }

/* ─── HEADER / CABEÇALHO ─── */
header {
  background: var(--branco);
  border-bottom: 1px solid var(--borda);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  height: 80px;
}

/* ─── LOGO SVG ─── */
.logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  flex-shrink: 0;
}

.logo-svg {
  width: 62px;
  height: 62px;
}

.logo-texto {
  display: flex;
  flex-direction: column;
  line-height: 1;
}

.logo-nome {
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 2rem;
  letter-spacing: 0.04em;
  color: var(--azul);
  line-height: 1;
}

.logo-nome .letra-a { color: var(--vermelho); }

.logo-sub {
  font-family: var(--fonte-logo);
  font-weight: 300;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--cinza-texto);
  margin-top: 3px;
}

.logo-sub-italic {
  font-family: var(--fonte-titulo);
  font-style: italic;
  font-size: 0.7rem;
  color: var(--vermelho);
  letter-spacing: 0.02em;
}

.divisor-logo {
  width: 2px;
  height: 38px;
  background: linear-gradient(to bottom, var(--azul), var(--vermelho));
  border-radius: 2px;
  margin: 0 4px;
}

/* ─── NAV ─── */
nav {
  display: flex;
  align-items: center;
  gap: 4px;
}

nav a {
  font-family: var(--fonte-logo);
  font-weight: 500;
  font-size: 0.78rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--azul-escuro);
  text-decoration: none;
  padding: 6px 10px;
  border-radius: 4px;
  transition: background 0.2s, color 0.2s;
  white-space: nowrap;
}

nav a:hover {
  background: var(--azul);
  color: var(--amarelo);
}

.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  padding: 6px;
  background: none;
  border: none;
}
.hamburger span {
  display: block;
  width: 24px;
  height: 2px;
  background: var(--azul-escuro);
  border-radius: 2px;
  transition: transform 0.3s;
}

/* ─── MOBILE NAV ─── */
.mobile-nav {
  display: none;
  flex-direction: column;
  background: var(--azul-escuro);
  padding: 16px 24px;
}
.mobile-nav.open { display: flex; }
.mobile-nav a {
  font-family: var(--fonte-logo);
  font-size: 0.85rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amarelo);
  text-decoration: none;
  padding: 10px 0;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}

/* ─── DATA / EDIÇÃO ─── */
.data-bar {
  background: var(--azul-escuro);
  color: rgba(255,255,255,0.65);
  font-family: var(--fonte-meta);
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 6px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  max-width: 100%;
}

/* ─── HERO / DESTAQUE PRINCIPAL ─── */
.hero {
  background: var(--azul-escuro);
  color: var(--branco);
  padding: 0;
  overflow: hidden;
  position: relative;
}

.hero-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  min-height: 480px;
}

.hero-content {
  padding: 52px 48px 52px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 2;
}

.hero-editoria {
  font-family: var(--fonte-logo);
  font-weight: 600;
  font-size: 0.7rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--amarelo);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.hero-editoria::before {
  content: '';
  display: block;
  width: 28px;
  height: 2px;
  background: var(--vermelho);
}

.hero-titulo {
  font-family: var(--fonte-titulo);
  font-size: clamp(1.8rem, 3vw, 2.8rem);
  font-weight: 900;
  line-height: 1.15;
  color: var(--branco);
  margin-bottom: 20px;
}

.hero-titulo em {
  color: var(--amarelo);
  font-style: italic;
}

.hero-resumo {
  font-family: var(--fonte-corpo);
  font-size: 1rem;
  color: rgba(255,255,255,0.78);
  line-height: 1.7;
  margin-bottom: 28px;
  max-width: 460px;
}

.hero-meta {
  font-family: var(--fonte-meta);
  font-size: 0.72rem;
  color: rgba(255,255,255,0.5);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.hero-imagem {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--azul) 0%, #0a1d3a 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-imagem-placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

/* Mapa do recôncavo estilizado em SVG como placeholder */
.hero-svg-art {
  width: 80%;
  max-width: 340px;
  opacity: 0.85;
}

/* ─── FAIXA BANDEIRA DIVISÓRIA ─── */
.faixa-divisoria {
  display: flex;
  height: 4px;
}
.faixa-divisoria span:nth-child(1) { background: var(--vermelho); flex: 1; }
.faixa-divisoria span:nth-child(2) { background: var(--amarelo); flex: 1; }
.faixa-divisoria span:nth-child(3) { background: var(--azul); flex: 1; }

/* ─── MAIN CONTENT ─── */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 24px;
}

/* ─── SEÇÃO TÍTULO ─── */
.secao-titulo {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 28px;
  padding-bottom: 12px;
  border-bottom: 2px solid var(--borda);
}

.secao-titulo h2 {
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 0.72rem;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--azul-escuro);
}

.secao-titulo-linha {
  flex: 1;
  height: 1px;
  background: var(--borda);
}

.secao-titulo-icone {
  width: 6px;
  height: 6px;
  background: var(--vermelho);
  transform: rotate(45deg);
}

/* ─── GRID DE MATÉRIAS ─── */
.grid-principal {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 40px;
  margin-bottom: 56px;
}

.coluna-principal { }
.coluna-lateral { }

/* ─── CARD DESTAQUE ─── */
.card-destaque {
  background: var(--branco);
  border: 1px solid var(--borda);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 28px;
  transition: box-shadow 0.25s;
  cursor: pointer;
}

.card-destaque:hover {
  box-shadow: 0 8px 32px rgba(0,61,165,0.12);
}

.card-destaque .img-placeholder {
  width: 100%;
  height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--fonte-logo);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  position: relative;
  overflow: hidden;
}

.card-destaque .card-body {
  padding: 24px;
}

.card-tag {
  display: inline-block;
  font-family: var(--fonte-logo);
  font-weight: 600;
  font-size: 0.62rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  padding: 3px 8px;
  margin-bottom: 12px;
  border-radius: 2px;
}

.tag-cultura { background: var(--azul); color: var(--amarelo); }
.tag-comercio { background: var(--vermelho); color: var(--branco); }
.tag-gastronomia { background: var(--amarelo); color: var(--azul-escuro); }
.tag-historia { background: var(--azul-escuro); color: var(--amarelo); }
.tag-festas { background: var(--vermelho); color: var(--amarelo); }
.tag-politica { background: #333; color: var(--amarelo); }
.tag-foco { background: var(--azul); color: var(--branco); }
.tag-editorial { background: var(--laranja); color: var(--branco); }

.card-destaque h3 {
  font-family: var(--fonte-titulo);
  font-size: 1.45rem;
  font-weight: 700;
  line-height: 1.25;
  color: var(--azul-escuro);
  margin-bottom: 12px;
}

.card-destaque h3 em {
  font-style: italic;
  color: var(--vermelho);
}

.card-destaque p {
  font-family: var(--fonte-corpo);
  font-size: 0.93rem;
  color: #555;
  line-height: 1.75;
  margin-bottom: 16px;
}

.card-meta {
  font-family: var(--fonte-meta);
  font-size: 0.68rem;
  color: #999;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 12px;
}

.card-meta::before {
  content: '';
  display: block;
  width: 16px;
  height: 1px;
  background: var(--vermelho);
}

/* ─── CARDS PEQUENOS ─── */
.card-pequeno {
  display: flex;
  gap: 14px;
  padding: 16px 0;
  border-bottom: 1px solid var(--borda);
  cursor: pointer;
  transition: opacity 0.2s;
}

.card-pequeno:hover { opacity: 0.75; }
.card-pequeno:last-child { border-bottom: none; }

.card-pequeno-img {
  width: 82px;
  height: 68px;
  flex-shrink: 0;
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.card-pequeno-body { flex: 1; }

.card-pequeno h4 {
  font-family: var(--fonte-titulo);
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.3;
  color: var(--azul-escuro);
  margin-top: 4px;
  margin-bottom: 6px;
}

.card-pequeno-meta {
  font-family: var(--fonte-meta);
  font-size: 0.63rem;
  color: #aaa;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─── SIDEBAR ─── */
.sidebar-widget {
  background: var(--branco);
  border: 1px solid var(--borda);
  border-top: 3px solid var(--azul);
  padding: 20px;
  margin-bottom: 24px;
}

.sidebar-widget-titulo {
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 0.65rem;
  letter-spacing: 0.26em;
  text-transform: uppercase;
  color: var(--azul);
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--borda);
}

.sidebar-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--borda);
  cursor: pointer;
}

.sidebar-item:last-child { border-bottom: none; }

.sidebar-item h5 {
  font-family: var(--fonte-titulo);
  font-size: 0.88rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--azul-escuro);
  margin-bottom: 4px;
  transition: color 0.2s;
}

.sidebar-item:hover h5 { color: var(--vermelho); }

.sidebar-item span {
  font-family: var(--fonte-meta);
  font-size: 0.62rem;
  color: #bbb;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* ─── FRASE DO RECÔNCAVO ─── */
.frase-reconvavo {
  background: var(--azul-escuro);
  color: var(--branco);
  text-align: center;
  padding: 48px 24px;
  margin: 40px 0;
  position: relative;
  overflow: hidden;
}

.frase-reconvavo::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4px;
  background: linear-gradient(to right, var(--vermelho), var(--amarelo), var(--azul));
}

.frase-reconvavo blockquote {
  font-family: var(--fonte-titulo);
  font-size: clamp(1.2rem, 2.5vw, 1.8rem);
  font-style: italic;
  font-weight: 400;
  line-height: 1.5;
  max-width: 700px;
  margin: 0 auto 16px;
  color: var(--amarelo);
}

.frase-reconvavo cite {
  font-family: var(--fonte-meta);
  font-size: 0.72rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
}

/* ─── GRADE EDITORIAS ─── */
.grade-editorias {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 20px;
  margin-bottom: 56px;
}

.editoria-card {
  background: var(--branco);
  border: 1px solid var(--borda);
  padding: 24px 20px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  position: relative;
  overflow: hidden;
}

.editoria-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
  background: var(--azul);
  transform: scaleX(0);
  transition: transform 0.3s;
}

.editoria-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.1); }
.editoria-card:hover::after { transform: scaleX(1); }

.editoria-icone {
  font-size: 1.6rem;
  margin-bottom: 10px;
}

.editoria-card h3 {
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 0.75rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--azul-escuro);
  line-height: 1.3;
}

/* ─── EDITORIAL ESPECIAL ─── */
.editorial-especial {
  background: linear-gradient(135deg, var(--vermelho) 0%, #8B0000 100%);
  color: var(--branco);
  padding: 48px;
  margin-bottom: 56px;
  border-radius: 2px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
  position: relative;
  overflow: hidden;
}

.editorial-especial::before {
  content: 'O COMÉRCIO MAIS BARATO DA BA';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: var(--fonte-logo);
  font-size: 5rem;
  font-weight: 900;
  letter-spacing: 0.05em;
  color: rgba(255,255,255,0.04);
  white-space: nowrap;
  pointer-events: none;
}

.editorial-especial-badge {
  display: inline-block;
  background: var(--amarelo);
  color: var(--azul-escuro);
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  padding: 4px 10px;
  margin-bottom: 20px;
  border-radius: 2px;
}

.editorial-especial h2 {
  font-family: var(--fonte-titulo);
  font-size: clamp(1.4rem, 2.5vw, 2rem);
  font-weight: 900;
  line-height: 1.2;
  color: var(--amarelo);
  margin-bottom: 16px;
}

.editorial-especial p {
  font-family: var(--fonte-corpo);
  font-size: 0.95rem;
  color: rgba(255,255,255,0.82);
  line-height: 1.75;
}

.editorial-especial-visual {
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ─── GRID BAIXO ─── */
.grid-baixo {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 24px;
  margin-bottom: 56px;
}

.card-medio {
  background: var(--branco);
  border: 1px solid var(--borda);
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.25s;
}

.card-medio:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

.card-medio .img-sm {
  width: 100%;
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--fonte-logo);
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.45);
  text-transform: uppercase;
}

.card-medio-body {
  padding: 18px;
}

.card-medio h3 {
  font-family: var(--fonte-titulo);
  font-size: 1.08rem;
  font-weight: 700;
  line-height: 1.3;
  color: var(--azul-escuro);
  margin-bottom: 8px;
}

.card-medio p {
  font-family: var(--fonte-corpo);
  font-size: 0.85rem;
  color: #666;
  line-height: 1.65;
}

/* ─── FOOTER ─── */
footer {
  background: var(--azul-escuro);
  color: rgba(255,255,255,0.65);
  padding: 48px 24px 24px;
}

.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
}

.footer-topo {
  display: grid;
  grid-template-columns: 1.5fr 1fr 1fr 1fr;
  gap: 36px;
  padding-bottom: 36px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  margin-bottom: 28px;
}

.footer-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.footer-logo-nome {
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 1.5rem;
  color: var(--amarelo);
  letter-spacing: 0.04em;
}

.footer-desc {
  font-family: var(--fonte-corpo);
  font-size: 0.85rem;
  line-height: 1.65;
  color: rgba(255,255,255,0.5);
}

.footer-col h4 {
  font-family: var(--fonte-logo);
  font-weight: 700;
  font-size: 0.65rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--amarelo);
  margin-bottom: 14px;
}

.footer-col ul { list-style: none; }
.footer-col li { margin-bottom: 8px; }
.footer-col a {
  font-family: var(--fonte-meta);
  font-size: 0.83rem;
  color: rgba(255,255,255,0.55);
  text-decoration: none;
  transition: color 0.2s;
}
.footer-col a:hover { color: var(--amarelo); }

.footer-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.footer-copy {
  font-family: var(--fonte-meta);
  font-size: 0.72rem;
  color: rgba(255,255,255,0.35);
  letter-spacing: 0.06em;
}

.footer-faixa {
  display: flex;
  height: 3px;
  margin-top: 28px;
}
.footer-faixa span:nth-child(1) { background: var(--vermelho); flex: 1; }
.footer-faixa span:nth-child(2) { background: var(--amarelo); flex: 1; }
.footer-faixa span:nth-child(3) { background: var(--azul); flex: 1; }

/* ─── PANDEIRO SVG ANIMADO ─── */
@keyframes rotate-lento {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes fade-in-up {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
